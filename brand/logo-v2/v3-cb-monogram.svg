<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img"><title>CamBridge – Lens C + Bridge</title>
  <rect width="1024" height="1024" fill="#0B1020"/>
  <!-- C: open lens ring, opening to the right -->
  <path d="M 700 320 A 270 270 0 1 0 700 704" fill="none" stroke="#4C8DFF" stroke-width="96" stroke-linecap="round"/>
  <!-- bridge spanning the C's opening (the link between devices) -->
  <path d="M 700 320 Q 860 512 700 704" fill="none" stroke="#34D1BF" stroke-width="60" stroke-linecap="round" stroke-dasharray="0 0"/>
  <circle cx="700" cy="320" r="58" fill="#34D1BF"/>
  <circle cx="700" cy="704" r="58" fill="#34D1BF"/>
  <!-- lens core -->
  <circle cx="470" cy="512" r="92" fill="#E8ECF4"/>
</svg>
